name: refresh-live

# Atualiza orderbook, funding e alertas do watcher a cada 15 min.
#
# Arquitetura (desde set/2026): o job `refresh` atualiza data/*, builda o
# index.html, roda o smoke test e commita SÓ data/ no main. O HTML gerado
# NÃO vai pro git — é publicado direto no GitHub Pages pelo job `deploy`
# (actions/deploy-pages). Pré-requisito: Settings → Pages → Source = "GitHub Actions".
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: refresh-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch orderbook consolidado (6 venues BR + Binance)
        run: python3 scripts/fetch_orderbook.py
        continue-on-error: true

      - name: Fetch funding perpétuos (Binance/Bybit/OKX)
        run: python3 scripts/fetch_funding.py
        continue-on-error: true

      - name: Watcher single-shot (detectors + Telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/watcher/run_once.py --min-severity medium --telegram-min-severity high
        continue-on-error: true

      - name: Correlator do watcher (alertas → eventos)
        run: python3 scripts/watcher/run_correlator.py
        continue-on-error: true

      - name: Rebuild dashboard
        run: python3 scripts/build_dashboard.py

      - name: Setup Node (smoke test)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke test do dashboard (jsdom)
        # Executa o JS do index.html buildado num DOM headless. Falha o job
        # (e portanto NÃO commita/publica) se algum renderer lançar exceção,
        # se o i18n não aplicar, ou se painéis-chave ficarem vazios.
        run: |
          npm install --no-save --no-audit --no-fund --no-package-lock jsdom@24
          node scripts/test_dashboard.mjs index.html

      - name: Commit & push (apenas data/)
        # index.html / dashboard/index.built.html estão no .gitignore — nunca
        # entram no git. Se outro workflow pushou no meio, rebase mantendo a
        # nossa versão dos dados (mais fresca) e tenta de novo.
        run: |
          git config user.name  "sentinel-br-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "sem mudanças em data/ — nada a commitar"
          else
            ts=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "refresh live · $ts"
            git push || (git pull --rebase -X theirs && git push)
          fi

      - name: Preparar artefato do Pages
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll

      - name: Upload artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
