name: refresh-daily

# Pipeline completo diário: OHLCV 12 meses, backtest, imprensa, correlator.
# Roda às 03:00 UTC (00:00 BRT) para atualizar séries históricas e análises.
#
# Arquitetura (desde set/2026): o job `daily` atualiza data/*, builda o
# index.html, roda o smoke test e commita SÓ data/ no main. O HTML gerado
# NÃO vai pro git — é publicado direto no GitHub Pages pelo job `deploy`
# (actions/deploy-pages). Pré-requisito: Settings → Pages → Source = "GitHub Actions".
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: refresh-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch OHLCV 12m (Binance/MB/Foxbit/on-chain)
        run: python3 scripts/fetch_data.py
        timeout-minutes: 8
        continue-on-error: true

      - name: Fetch OHLCV 1h 30d (Binance/MB/Foxbit BR — intraday)
        run: python3 scripts/fetch_hourly.py
        timeout-minutes: 4
        continue-on-error: true

      - name: Fetch CoinGecko (volume 30d por exchange)
        run: python3 scripts/fetch_coingecko.py
        timeout-minutes: 4
        continue-on-error: true

      - name: Fetch TRON on-chain (USDT TRC-20)
        run: python3 scripts/fetch_tron.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Fetch funding perpétuos
        run: python3 scripts/fetch_funding.py
        timeout-minutes: 2
        continue-on-error: true

      - name: Fetch orderbook consolidado
        run: python3 scripts/fetch_orderbook.py
        timeout-minutes: 2
        continue-on-error: true

      - name: Fetch RSS imprensa BR + classify + correlate
        # news_watch.py é o pipeline completo (fetch → classify → correlate → persist).
        # fetcher.py sozinho só imprime no stdout, não escreve data/news.json.
        run: python3 scripts/news/news_watch.py
        timeout-minutes: 4
        continue-on-error: true

      - name: Detect anomalies (Z-score, divergence, ring-of-mules, stablecoin_flight)
        run: python3 scripts/detect_anomalies.py

      - name: Incident backtest
        run: python3 scripts/incident_backtest.py
        continue-on-error: true

      - name: News correlator (alertas × manchetes)
        run: python3 scripts/news/correlator.py
        continue-on-error: true

      - name: Daily Telegram digest (severity ≥ high hoje)
        # só dispara se TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID estiverem nos secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/daily_telegram.py --min-sev high --days 1
        timeout-minutes: 2
        continue-on-error: true

      - name: Rebuild dashboard
        run: python3 scripts/build_dashboard.py

      - name: Setup Node (smoke test)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke test do dashboard (jsdom)
        # Executa o JS do index.html buildado num DOM headless. Falha o job
        # (e portanto NÃO commita/publica) se algum renderer lançar exceção,
        # se o i18n não aplicar, ou se painéis-chave ficarem vazios.
        run: |
          npm install --no-save --no-audit --no-fund --no-package-lock jsdom@24
          node scripts/test_dashboard.mjs index.html

      - name: Commit & push (apenas data/)
        # index.html / dashboard/index.built.html estão no .gitignore — nunca
        # entram no git. Se outro workflow pushou no meio, rebase mantendo a
        # nossa versão dos dados (mais fresca) e tenta de novo.
        run: |
          git config user.name  "sentinel-br-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "sem mudanças em data/ — nada a commitar"
          else
            ts=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "refresh daily · $ts"
            git push || (git pull --rebase -X theirs && git push)
          fi

      - name: Preparar artefato do Pages
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll

      - name: Upload artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: daily
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
